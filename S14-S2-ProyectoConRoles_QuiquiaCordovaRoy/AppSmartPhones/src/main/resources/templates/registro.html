<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro de Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h4>📝 Registrar Nuevo Usuario</h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/registro}" th:object="${user}" method="post">
                            <div class="mb-3">
                                <label for="username" class="form-label">Usuario</label>
                                <input type="text" th:field="*{username}" class="form-control" required>
                                <div th:if="${#fields.hasErrors('username')}" class="text-danger">
                                    <span th:each="err : ${#fields.errors('username')}" th:text="${err}"></span>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Contraseña</label>
                                <input type="password" th:field="*{password}" class="form-control" required>
                                <div th:if="${#fields.hasErrors('password')}" class="text-danger">
                                    <span th:each="err : ${#fields.errors('password')}" th:text="${err}"></span>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="nombreCompleto" class="form-label">Nombre Completo</label>
                                <input type="text" th:field="*{nombreCompleto}" class="form-control">
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" th:field="*{email}" class="form-control">
                            </div>

                            <div class="d-flex justify-content-between">
                                <a th:href="@{/login}" class="btn btn-secondary">Volver al Login</a>
                                <button type="submit" class="btn btn-success">Registrarse</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
