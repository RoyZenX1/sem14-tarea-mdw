<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${accion == 'nuevo'} ? 'Nuevo Celular' : 'Editar Celular'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .error-message {
            color: #dc3545;
            font-size: 0.875em;
            margin-top: 0.25rem;
        }
        .is-invalid {
            border-color: #dc3545;
        }
        .alert-danger ul {
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3 th:text="${accion == 'nuevo'} ? 'Registrar Nuevo Celular' : 'Editar Celular'"></h3>
                    </div>
                    <div class="card-body">
                        <!-- Mostrar mensajes flash (success) -->
                        <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
                            <span th:text="${mensaje}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        
                        <form th:action="${accion == 'nuevo'} ? @{/celulares/guardar} : @{/celulares/actualizar}" 
                              th:object="${celular}" method="post">
                            
                            <!-- Mostrar errores globales del formulario (SOLO dentro del <form> con th:object) -->
                            <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                                <ul>
                                    <li th:each="err : ${#fields.globalErrors()}" th:text="${err}"></li>
                                </ul>
                            </div>
                            
                            <!-- Campo: Número de Serie -->
                            <div class="mb-3">
                                <label for="numeroSerie" class="form-label">Número de Serie:</label>
                                <input type="text" th:field="*{numeroSerie}" 
                                       th:classappend="${#fields.hasErrors('numeroSerie')} ? 'is-invalid' : ''"
                                       class="form-control" required th:readonly="${accion == 'editar'}">
                                <div th:if="${#fields.hasErrors('numeroSerie')}" class="error-message">
                                    <span th:each="err : ${#fields.errors('numeroSerie')}" th:text="${err}"></span>
                                </div>
                                <small class="text-muted" th:if="${accion == 'editar'}">El número de serie no se puede modificar</small>
                            </div>
                            
                            <!-- Campo: Marca -->
                            <div class="mb-3">
                                <label for="marca" class="form-label">Marca:</label>
                                <input type="text" th:field="*{marca}" 
                                       th:classappend="${#fields.hasErrors('marca')} ? 'is-invalid' : ''"
                                       class="form-control" required>
                                <div th:if="${#fields.hasErrors('marca')}" class="error-message">
                                    <span th:each="err : ${#fields.errors('marca')}" th:text="${err}"></span>
                                </div>
                            </div>
                            
                            <!-- Campo: Modelo -->
                            <div class="mb-3">
                                <label for="modelo" class="form-label">Modelo:</label>
                                <input type="text" th:field="*{modelo}" 
                                       th:classappend="${#fields.hasErrors('modelo')} ? 'is-invalid' : ''"
                                       class="form-control" required>
                                <div th:if="${#fields.hasErrors('modelo')}" class="error-message">
                                    <span th:each="err : ${#fields.errors('modelo')}" th:text="${err}"></span>
                                </div>
                            </div>
                            
                            <!-- Campo: Megapixeles -->
                            <div class="mb-3">
                                <label for="megapixeles" class="form-label">Megapixeles de Cámara:</label>
                                <input type="number" th:field="*{megapixeles}" 
                                       th:classappend="${#fields.hasErrors('megapixeles')} ? 'is-invalid' : ''"
                                       class="form-control" required min="0" step="1">
                                <div th:if="${#fields.hasErrors('megapixeles')}" class="error-message">
                                    <span th:each="err : ${#fields.errors('megapixeles')}" th:text="${err}"></span>
                                </div>
                            </div>
                            
                            <!-- Campo: Almacenamiento -->
                            <div class="mb-3">
                                <label for="almacenamiento_GB" class="form-label">Almacenamiento (GB):</label>
                                <input type="number" th:field="*{almacenamiento_GB}" 
                                       th:classappend="${#fields.hasErrors('almacenamiento_GB')} ? 'is-invalid' : ''"
                                       class="form-control" required min="0" step="1">
                                <div th:if="${#fields.hasErrors('almacenamiento_GB')}" class="error-message">
                                    <span th:each="err : ${#fields.errors('almacenamiento_GB')}" th:text="${err}"></span>
                                </div>
                            </div>
                            
                            <!-- Campo: Foto URL -->
                            <div class="mb-3">
                                <label for="fotoUrl" class="form-label">URL de la Foto:</label>
                                <input type="url" th:field="*{fotoUrl}" 
                                       th:classappend="${#fields.hasErrors('fotoUrl')} ? 'is-invalid' : ''"
                                       class="form-control" placeholder="https://ejemplo.com/foto.jpg">
                                <div th:if="${#fields.hasErrors('fotoUrl')}" class="error-message">
                                    <span th:each="err : ${#fields.errors('fotoUrl')}" th:text="${err}"></span>
                                </div>
                                <small class="text-muted">Ingrese una URL válida de la imagen del celular</small>
                            </div>
                            
                            <div class="d-flex justify-content-between">
                                <a th:href="@{/celulares/lista}" class="btn btn-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-primary">Guardar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
