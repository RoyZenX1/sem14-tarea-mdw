<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Lista de Celulares</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-4">
        <h1 class="mb-4">Lista de Celulares</h1>
        
        <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${mensaje}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        
        <!-- Solo ADMIN ve el botón Nuevo -->
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/celulares/nuevo}" class="btn btn-primary mb-3">Nuevo Celular</a>
        
        <table class="table table-striped table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>Número de Serie</th>
                    <th>Marca</th>
                    <th>Modelo</th>
                    <th>Megapixeles</th>
                    <th>Almacenamiento (GB)</th>
                    <th>Foto</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="celular : ${celulares}">
                    <td th:text="${celular.numeroSerie}"></td>
                    <td th:text="${celular.marca}"></td>
                    <td th:text="${celular.modelo}"></td>
                    <td th:text="${celular.megapixeles}"></td>
                    <td th:text="${celular.almacenamiento_GB}"></td>
                    <td>
                        <img th:if="${celular.fotoUrl}" th:src="${celular.fotoUrl}" 
                             style="width: 50px; height: 50px; object-fit: cover;" 
                             class="img-thumbnail" alt="Foto">
                        <span th:unless="${celular.fotoUrl}">Sin foto</span>
                    </td>
                    <td>
                        <a th:href="@{/celulares/ver/{id}(id=${celular.numeroSerie})}"
                           class="btn btn-info btn-sm">Ver</a>
                        <!-- Editar y Eliminar: solo ADMIN -->
                        <a sec:authorize="hasRole('ADMIN')"
                           th:href="@{/celulares/editar/{id}(id=${celular.numeroSerie})}"
                           class="btn btn-warning btn-sm">Editar</a>
                        <form sec:authorize="hasRole('ADMIN')"
                              th:action="@{/celulares/eliminar/{id}(id=${celular.numeroSerie})}"
                              method="post" class="d-inline"
                              onsubmit="return confirm('¿Está seguro de eliminar este celular?')">
                            <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${celulares.empty}">
                    <td colspan="7" class="text-center">No hay celulares registrados</td>
                </tr>
            </tbody>
        </table>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
