<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - SmartPhones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <!-- Tarjeta de login -->
                <div class="card shadow-lg border-0 rounded-4">
                    <!-- Header -->
                    <div class="card-header bg-white text-center border-0 pt-4 pb-0">
                        <div class="display-1 mb-2">📱</div>
                        <h3 class="fw-bold text-dark">SmartPhones</h3>
                        <p class="text-muted small">Sistema de Gestión de Celulares</p>
                    </div>
                    
                    <!-- Body -->
                    <div class="card-body p-4">
                        <!-- Mensaje de error -->
                        <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <i class="fas fa-exclamation-circle me-2"></i>
                            Usuario o contraseña incorrectos. Por favor, intente nuevamente.
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                        
                        <!-- Mensaje de logout -->
                        <div th:if="${param.logout}" class="alert alert-success alert-dismissible fade show" role="alert">
                            <i class="fas fa-check-circle me-2"></i>
                            Has cerrado sesión correctamente.
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                        
                        <!-- Mensaje de registro exitoso -->
                        <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
                            <i class="fas fa-check-circle me-2"></i>
                            <span th:text="${mensaje}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <!-- Formulario de Login -->
                        <form th:action="@{/login}" method="post">
                            <div class="mb-3 position-relative">
                                <i class="fas fa-user position-absolute top-50 start-0 translate-middle-y ms-3 text-secondary"></i>
                                <input type="text" 
                                       id="username" 
                                       name="username" 
                                       class="form-control ps-5" 
                                       placeholder="Usuario" 
                                       required 
                                       autofocus>
                            </div>
                            
                            <div class="mb-3 position-relative">
                                <i class="fas fa-lock position-absolute top-50 start-0 translate-middle-y ms-3 text-secondary"></i>
                                <input type="password" 
                                       id="password" 
                                       name="password" 
                                       class="form-control ps-5" 
                                       placeholder="Contraseña" 
                                       required>
                            </div>
                            
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="remember-me" name="remember-me">
                                <label class="form-check-label" for="remember-me">Recordarme</label>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" id="loginButton">
                                <i class="fas fa-sign-in-alt me-2"></i>
                                Iniciar Sesión
                            </button>
                        </form>
                       
                        <!-- Enlace a registro -->
                        <div class="mt-3 text-center">
                            <i class="fas fa-user-plus me-1 text-secondary"></i>
                            ¿No tienes cuenta? <a href="/registro" class="text-primary fw-bold text-decoration-none">Regístrate aquí</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Mostrar spinner al hacer submit
        document.querySelector('form').addEventListener('submit', function() {
            const button = document.getElementById('loginButton');
            button.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Iniciando sesión...';
            button.disabled = true;
        });

        // Auto-cerrar alertas después de 5 segundos
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                const alerts = document.querySelectorAll('.alert');
                alerts.forEach(function(alert) {
                    alert.style.transition = 'opacity 0.5s ease';
                    alert.style.opacity = '0';
                    setTimeout(function() {
                        alert.remove();
                    }, 500);
                });
            }, 5000);
        });

        // Permite presionar Enter para submit
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const form = document.querySelector('form');
                if (form) {
                    form.submit();
                }
            }
        });
    </script>
</body>
</html>
