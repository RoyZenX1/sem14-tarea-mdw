<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Acceso denegado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card border-danger">
                    <div class="card-header bg-danger text-white">
                        <h4 class="mb-0">🚫 Acceso denegado (403)</h4>
                    </div>
                    <div class="card-body">
                        <p>No tienes permisos para realizar esta acción.</p>
                        <p class="text-muted mb-4">Crear, editar y eliminar celulares es exclusivo del rol <strong>ADMIN</strong>.</p>
                        <a th:href="@{/celulares/lista}" class="btn btn-primary">Volver a la lista</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
