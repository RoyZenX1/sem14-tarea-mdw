<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Detalle del Celular</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3>Detalle del Celular</h3>
                    </div>
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <img th:if="${celular.fotoUrl}" th:src="${celular.fotoUrl}" 
                                 style="max-width: 200px; max-height: 200px; object-fit: cover;" 
                                 class="img-fluid rounded" alt="Foto del celular">
                            <div th:unless="${celular.fotoUrl}" class="alert alert-info">
                                No hay foto disponible
                            </div>
                        </div>
                        
                        <table class="table table-bordered">
                            <tr>
                                <th>Número de Serie:</th>
                                <td th:text="${celular.numeroSerie}"></td>
                            </tr>
                            <tr>
                                <th>Marca:</th>
                                <td th:text="${celular.marca}"></td>
                            </tr>
                            <tr>
                                <th>Modelo:</th>
                                <td th:text="${celular.modelo}"></td>
                            </tr>
                            <tr>
                                <th>Megapixeles:</th>
                                <td th:text="${celular.megapixeles} + ' MP'"></td>
                            </tr>
                            <tr>
                                <th>Almacenamiento:</th>
                                <td th:text="${celular.almacenamiento_GB} + ' GB'"></td>
                            </tr>
                        </table>
                        
                        <div class="d-flex justify-content-between">
                            <a th:href="@{/celulares/lista}" class="btn btn-secondary">Volver</a>
                            <!-- Editar y Eliminar: solo ADMIN -->
                            <div sec:authorize="hasRole('ADMIN')" class="d-flex gap-2">
                                <a th:href="@{/celulares/editar/{id}(id=${celular.numeroSerie})}"
                                   class="btn btn-warning">Editar</a>
                                <form th:action="@{/celulares/eliminar/{id}(id=${celular.numeroSerie})}"
                                      method="post" class="m-0"
                                      onsubmit="return confirm('¿Está seguro de eliminar este celular?')">
                                    <button type="submit" class="btn btn-danger">Eliminar</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
